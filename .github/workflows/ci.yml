name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly: the sites under test are live, so catch regressions on their side too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  a11y:
    name: Accessibility (WCAG 2.2 AA)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node scripts/report.ts reports/a11y-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: a11y-summary
          path: reports/a11y-summary.json
          retention-days: 90

  gate-selftest:
    name: Gate self-test (must fail on planted defects)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node gate/selftest.ts

  # Calls the reusable gate the way another repo would, against this repo's clean fixture page.
  gate-dogfood:
    name: Reusable gate
    needs: quality
    uses: ./.github/workflows/a11y-gate.yml
    with:
      start-command: python3 -m http.server 8080 --directory gate/fixtures
      wait-for: http://localhost:8080/good.html
      urls: http://localhost:8080/good.html
      gate-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  pr-comment:
    name: PR comment
    needs: a11y
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: a11y-summary
          path: reports
      - run: node scripts/pr-comment.ts reports/a11y-summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Opens, updates and closes regression issues, but only for runs of main (weekly or manual).
  # Everywhere else it's a dry run: the plan goes to the job summary and nothing changes.
  regressions:
    name: Regression issues
    needs: a11y
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: a11y-summary
          path: reports
      - name: File issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ "$APPLY" = "true" ]; then mode=""; else mode="--dry-run"; fi
          node scripts/file-issues.ts reports/a11y-summary.json $mode >> "$GITHUB_STEP_SUMMARY"

  # Publishes the latest results and the trend to GitHub Pages. Runs on main once the repo
  # variable A11Y_PAGES is "true" (set after Pages is turned on with source "GitHub Actions").
  pages:
    name: Publish results page
    needs: a11y
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.A11Y_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: a11y-summary
          path: reports
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/report
      - uses: actions/configure-pages@v6
        id: pages
      - run: node scripts/build-site.ts reports/a11y-summary.json site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deploy
